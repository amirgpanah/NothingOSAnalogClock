          // renderClocksList() would destroy the row mid-interaction (killing
          // the eye/trash hover state and the catch-up animation's trigger
          // context). The row's own .tz-value is already correct -- the
          // setClockTimezone caller updates it -- and indices only change on
          // add/remove/reorder, never on a timezone pick. The sidebar row
          // marks itself via state._fromSidebarRow around the call (see
          // renderClocksList below).
          if (!state._fromSidebarRow) renderClocksList();
        }

        function handVector(angleDeg) {
          const rad = (angleDeg * Math.PI) / 180;
          return { dx: Math.sin(rad), dy: -Math.cos(rad) };
        }

        function setHand(line, angle, frac, cx, cy, radius) {
          const { dx, dy } = handVector(angle);
          const forwardLen = radius * frac;
          const tailLen = forwardLen * HAND_TAIL_FRAC;
          line.setAttribute("x1", cx - dx * tailLen);
          line.setAttribute("y1", cy - dy * tailLen);
          line.setAttribute("x2", cx + dx * forwardLen);
          line.setAttribute("y2", cy + dy * forwardLen);
        }

        function setSecondHand(shaft, head, angle, frac, cx, cy, radius) {
          // Thin shaft: one continuous line, tail through the pivot to the tip.
          // The flare below is a separate overlay, so this line is never broken.
          setHand(shaft, angle, frac, cx, cy, radius);
          const { dx, dy } = handVector(angle);
          const tailLen = radius * frac * HAND_TAIL_FRAC;
          const gapLen = tailLen * SECOND_TAIL_GAP_FRAC;

          // Flare: sits on the tail, past a small gap from the hub, running out to
          // the tail's very end — reading outward from the hub: hub, gap, chisel.
          head.setAttribute("x1", cx - dx * gapLen);
          head.setAttribute("y1", cy - dy * gapLen);
          head.setAttribute("x2", cx - dx * tailLen);
          head.setAttribute("y2", cy - dy * tailLen);
        }

        function updateGridUnits(state) {
          state.gridX = (state.x - phaseX) / GRID_SIZE;
          state.gridY = (state.y - phaseY) / GRID_SIZE;
          state.gridW = state.w / GRID_SIZE;
          state.gridH = state.h / GRID_SIZE;
        }

        function resizeClock(state, x, y, w, h) {
          w = Math.max(w, minSize());
          h = Math.max(h, minSize());
          state.x = x;
          state.y = y;
          state.w = w;
          state.h = h;
          state.el.style.left = x + "px";
          state.el.style.top = y + "px";
          state.el.style.width = w + "px";
          state.el.style.height = h + "px";
          state.svg.setAttribute("width", w);
          state.svg.setAttribute("height", h);
          layoutHandles(state);
          renderTicks(state);
          updateHands(state, getNow());
          updateGridUnits(state);
          positionContextMenu(state);
        }

        // Re-derives each clock's pixel position/size from its stored grid-unit
        // footprint against the newly recomputed GRID_SIZE and phase, so a clock
        // keeps the same footprint relative to the (re-centered) grid, rather than
        // drifting from it or landing out of alignment when the window resizes.
        function rescaleClocksToGrid() {
          clocks.forEach((c) => {
            resizeClock(
              c,
              phaseX + c.gridX * GRID_SIZE,
              phaseY + c.gridY * GRID_SIZE,
              c.gridW * GRID_SIZE,
              c.gridH * GRID_SIZE,
            );
          });
        }

        // ---------- Interaction: creating a clock via marquee ----------
        let clocks = [];

        function clearClocks() {
          clocks.forEach((c) => c.el.remove());
          clocks = [];
          renderClocksList();
        }

        function removeClock(state) {
          state.el.remove();
          clocks = clocks.filter((c) => c !== state);
          refreshAllStackButtons();
          renderClocksList();
        }

        // ---------- Clock stacking order ----------
        // Deliberately DOM-order based, not z-index: giving each .clock an
        // explicit z-index would make it establish its own stacking context,
        // which would trap that clock's context menu (position:fixed,
        // z-index:50) inside it -- a clock stacked further back would then
        // have its menu rendered behind a clock stacked in front of it even
        // while hovering the back one, which defeats the point. Reordering
        // the actual DOM nodes avoids that entirely, and only ever affects
        // ordering among clocks.el themselves (all children of #canvas) --
        // it can't touch #sidebar's stacking since that's a sibling of
        // #canvas, not a member of this reordering at all.
        //
        // Convention: clocks[0] is the TOPMOST clock (also "1" in the
        // sidebar list, via renderClocksList's i+1). DOM stacking puts
        // later-appended elements on top, so building the array in reverse
        // order is what makes index 0 end up appended last.
        function applyStackOrder() {
          for (let i = clocks.length - 1; i >= 0; i--) {
            canvas.appendChild(clocks[i].el);
          }
        }

        function updateStackButtons(state) {
          const idx = clocks.indexOf(state);
          if (idx === -1) return;
          state.stackForwardBtn.disabled = idx === 0; // already topmost
          state.stackBackBtn.disabled = idx === clocks.length - 1; // already bottommost
        }

        function refreshAllStackButtons() {
          clocks.forEach(updateStackButtons);
        }

        // direction: -1 moves toward index 0 (forward/up, toward the top),
        // +1 moves toward the end (backward/down, toward the bottom).
        function moveClockInStack(state, direction) {
          const idx = clocks.indexOf(state);
          if (idx === -1) return;
          const targetIdx = idx + direction;
          if (targetIdx < 0 || targetIdx >= clocks.length) return; // already at the top/bottom
          const moved = clocks[targetIdx];
          clocks[targetIdx] = clocks[idx];
          clocks[idx] = moved;
          applyStackOrder();
          refreshAllStackButtons();
          renderClocksList();
        }

        document
          .getElementById("clearAllBtn")
          .addEventListener("click", clearClocks);

        let dragging = null; // marquee-in-progress state
        let marqueeEl = null;
        const DRAG_DISTANCE_THRESHOLD = 5; // px of raw pointer movement below which a press counts as a click/tap, not a drag

        canvas.addEventListener("pointerdown", (e) => {
          if (e.target !== canvas) return; // ignore clicks starting on an existing clock/handle
          canvas.setPointerCapture(e.pointerId);
          const startX = snap(e.clientX, phaseX),
            startY = snap(e.clientY, phaseY);
          dragging = {
            startX,
            startY,
            rawStartX: e.clientX,
            rawStartY: e.clientY,
            pointerId: e.pointerId,
          };

          marqueeEl = document.createElement("div");
          marqueeEl.className = "marquee";
          marqueeEl.style.left = startX + "px";
          marqueeEl.style.top = startY + "px";
          marqueeEl.style.width = "0px";
          marqueeEl.style.height = "0px";
          document.body.appendChild(marqueeEl);
        });

        canvas.addEventListener("pointermove", (e) => {
          if (!dragging || e.pointerId !== dragging.pointerId) return;
          const curX = snap(e.clientX, phaseX),
            curY = snap(e.clientY, phaseY);
          const x = Math.min(dragging.startX, curX);
          const y = Math.min(dragging.startY, curY);
          const w = Math.abs(curX - dragging.startX);
          const h = Math.abs(curY - dragging.startY);
          marqueeEl.style.left = x + "px";
          marqueeEl.style.top = y + "px";
          marqueeEl.style.width = w + "px";
          marqueeEl.style.height = h + "px";
        });

        // ---------- Snackbar ----------
        const snackbarEl = document.getElementById("snackbar");
        let snackbarTimer = null;

        function showSnackbar(message) {
          snackbarEl.textContent = message;
          clearTimeout(snackbarTimer);
          // Restart the transition cleanly even if a snackbar is already showing.
          snackbarEl.classList.remove("visible");
          void snackbarEl.offsetWidth; // force reflow so the removed class actually takes effect first
          snackbarEl.classList.add("visible");
          snackbarTimer = setTimeout(() => {
            snackbarEl.classList.remove("visible");
          }, 1000);
        }

        function notifyDragRequired() {
          showSnackbar("Drag on the grid to draw a clock");
        }

        function notifySelectionTooSmall() {
          showSnackbar(
            `Selection can't be smaller than ${MIN_SIZE_FACTOR} grid cells`,
          );
        }

        function notifyOverlap() {
          showSnackbar("Clocks can't overlap");
        }

        function finishMarquee(e) {
          if (!dragging || e.pointerId !== dragging.pointerId) return;
          const rawDist = Math.hypot(
            e.clientX - dragging.rawStartX,
            e.clientY - dragging.rawStartY,
          );
          const curX = snap(e.clientX, phaseX),
            curY = snap(e.clientY, phaseY);
          let x = Math.min(dragging.startX, curX);
          let y = Math.min(dragging.startY, curY);
          let w = Math.abs(curX - dragging.startX);
          let h = Math.abs(curY - dragging.startY);

          if (marqueeEl) {
            marqueeEl.remove();
            marqueeEl = null;
          }
          dragging = null;

          if (rawDist < DRAG_DISTANCE_THRESHOLD) {
            notifyDragRequired();
            return;
          }

          if (w < minSize() || h < minSize()) {
            notifySelectionTooSmall();
            return;
          }

          if (!keepPreviousClocks) clearClocks(); // default: a new marquee replaces the previous clock(s)

          if (!allowOverlap && overlapsExistingClock(x, y, w, h)) {
            notifyOverlap();
            return;
          }

          const clock = createClock(x, y, w, h);
          clocks.unshift(clock); // new clocks appear on top -- see the stacking-order convention above
          applyStackOrder();
          refreshAllStackButtons();
          renderClocksList();
        }

        canvas.addEventListener("pointerup", finishMarquee);
        canvas.addEventListener("pointercancel", finishMarquee);

        // ---------- Interaction: moving & resizing an existing clock ----------
        function attachClockInteractions(state) {
          let moving = null;

          const TAP_MOVE_THRESHOLD = 5; // px of movement allowed before a press counts as a drag, not a tap
          const TAP_TIME_THRESHOLD = 300; // ms

          state.el.addEventListener("pointerdown", (e) => {
            // Handles call stopPropagation on their own pointerdown, so any event
            // that reaches here (whether the target is the div, the SVG, or a
            // tick/hand inside it) is safe to treat as the start of a move.
            state.el.setPointerCapture(e.pointerId);
            moving = {
              pointerId: e.pointerId,
              offX: e.clientX - state.x,
              offY: e.clientY - state.y,
              startClientX: e.clientX,
              startClientY: e.clientY,
              startTime: performance.now(),
              moved: false,
            };
            e.stopPropagation();
          });
          state.el.addEventListener("pointermove", (e) => {
            if (!moving || e.pointerId !== moving.pointerId) return;
            const dist = Math.hypot(
              e.clientX - moving.startClientX,
              e.clientY - moving.startClientY,
            );
            if (dist > TAP_MOVE_THRESHOLD) moving.moved = true;
            const x = snap(e.clientX - moving.offX, phaseX);
            const y = snap(e.clientY - moving.offY, phaseY);
            if (!allowOverlap && overlapsExistingClock(x, y, state.w, state.h, state)) {
              return; // would land on another clock -- hold at the last valid spot
            }
            state.x = x;
            state.y = y;
            state.el.style.left = x + "px";
            state.el.style.top = y + "px";
            positionContextMenu(state);
          });
          function stopMove(e) {
            if (!moving || e.pointerId !== moving.pointerId) return;
            const wasTap =
              !moving.moved &&
              performance.now() - moving.startTime < TAP_TIME_THRESHOLD;
            moving = null;
            if (wasTap) {
              state.el.classList.toggle("show-handles");
            } else {
              updateGridUnits(state);
            }
          }
          state.el.addEventListener("pointerup", stopMove);
          state.el.addEventListener("pointercancel", stopMove);

          // Once a dragged edge would push size below the minimum, freeze both
          // size and position at exactly the minimum instead of letting position
          // keep tracking the pointer — otherwise the box visibly slides across
          // the grid even though its size has stopped shrinking. Expanding back
          // out past the minimum resumes normal tracking immediately.
          function clampResizeAxis(anchor, cur, min) {
            const naturalSize = Math.abs(cur - anchor);
            if (naturalSize < min) {
              return { pos: cur < anchor ? anchor - min : anchor, size: min };
            }
            return { pos: Math.min(anchor, cur), size: naturalSize };
          }

          // Edge midpoints (n/s/e/w) only ever resize one axis; corners resize
          // both. Locked axis keeps the clock's current x/w or y/h exactly as
          // they are, ignoring pointer movement on that axis entirely.
          const AXIS_LOCK = { n: "x", s: "x", e: "y", w: "y" };

          Object.entries(state.handles).forEach(([corner, handle]) => {
            let resizing = null;
            handle.addEventListener("pointerdown", (e) => {
              e.stopPropagation();
              handle.setPointerCapture(e.pointerId);
              resizing = {
                pointerId: e.pointerId,
                anchorX: corner.includes("e") ? state.x : state.x + state.w,
                anchorY: corner.includes("s") ? state.y : state.y + state.h,
              };
            });
            handle.addEventListener("pointermove", (e) => {
              if (!resizing || e.pointerId !== resizing.pointerId) return;
              const curX = snap(e.clientX, phaseX),
                curY = snap(e.clientY, phaseY);
              const m = minSize();
              const lock = AXIS_LOCK[corner];

              let x, w;
              if (lock === "x") {
                x = state.x;
                w = state.w;
              } else {
                ({ pos: x, size: w } = clampResizeAxis(resizing.anchorX, curX, m));
              }

              let y, h;
              if (lock === "y") {
                y = state.y;
                h = state.h;
              } else {
                ({ pos: y, size: h } = clampResizeAxis(resizing.anchorY, curY, m));
              }

              if (!allowOverlap && overlapsExistingClock(x, y, w, h, state)) {
                e.stopPropagation();
                return; // would grow into another clock -- hold at the last valid size
              }

              resizeClock(state, x, y, w, h);
              e.stopPropagation();
            });
            function stopResize(e) {
              if (!resizing || e.pointerId !== resizing.pointerId) return;
              resizing = null;
            }
            handle.addEventListener("pointerup", stopResize);
            handle.addEventListener("pointercancel", stopResize);
          });
        }

        // ---------- Animation loop: smooth sweeping hands, live time ----------
        function tick() {
          const now = getNow();
          clocks.forEach((c) => {
            updateHands(c, now);
            if (c.tickShapeAnim) animateTickShape(c);
          });
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);

        // ==========================================================================
        // SIDEBAR WIRING
        // Everything below reads/writes the state declared above (clocks, GRID_SIZE,
        // GRID_SIZE, gridOrigin, gridVisible, snapEnabled, showMinuteMarkers,
        // showSecondHand, keepPreviousClocks, timeOverride) and re-renders through
        // the same functions the marquee/resize code already uses (computeGrid,
        // rescaleClocksToGrid, renderTicks, updateHands), so there are two code
        // paths driving the app (direct interaction, and the sidebar) but only one
        // source of truth for each setting.
        // ==========================================================================

        // ---- generic toggle helper: flips aria-checked and calls back with the new value ----
        function wireToggle(id, initial, onChange) {
          const el = document.getElementById(id);
          let value = initial;
          el.setAttribute("aria-checked", String(value));
          // Hover nudge (see sidebar.css): fires once per cursor entry.
          // A class -- not :hover -- drives it, so flipping aria-checked on
          // click can never restart it under a stationary cursor.
          el.addEventListener("mouseenter", () => {
            if (el.classList.contains("nudge")) return;
            el.classList.add("nudge");
          });
          el.querySelector(".toggle-knob").addEventListener("animationend", () => {
            el.classList.remove("nudge");
          });
          el.addEventListener("click", () => {
            value = !value;
            // Freeze-then-flip: if a hover nudge is mid-flight, its keyframe
            // is painting over the transition's output -- removing .nudge
            // would snap the knob back to the pre-flip rest point and then
            // jump. Instead, capture the live position, kill the animation,
            // and re-anchor from there so the on/off transition runs
            // continuously from where the eye already sees the knob.
            const knob = el.querySelector(".toggle-knob");
            if (el.classList.contains("nudge")) {
              const live = getComputedStyle(knob).transform;
              el.classList.remove("nudge");
              knob.style.transform = live === "none" ? "" : live;
              // Inline matrix would pin the knob -- clear it next frame so
              // the aria-checked rule (and its transition) takes over.
              requestAnimationFrame(() => requestAnimationFrame(() => {
                knob.style.transform = "";
              }));
            }
            el.setAttribute("aria-checked", String(value));
            onChange(value);
          });
        }

        // ---- The Clear row only makes sense with "keep previous clocks" on --
        // greyed out, not hidden, so the layout doesn't reflow. ----
        const clearRow = document.querySelector('[data-depends-on="toggle-keep"]');
        function updateClearRow(isEnabled) {
          clearRow.classList.toggle("is-disabled", !isEnabled);
        }
        updateClearRow(keepPreviousClocks);

        wireToggle("toggle-grid", gridVisible, (v) => {
          gridVisible = v;
          computeGrid();
        });
        wireToggle("toggle-snap", snapEnabled, (v) => {
          snapEnabled = v;
        });
        wireToggle("toggle-keep", keepPreviousClocks, (v) => {
          keepPreviousClocks = v;
          updateClearRow(v);
        });
        wireToggle("toggle-minutemarkers", showMinuteMarkers, (v) => {
          showMinuteMarkers = v;
          clocks.forEach(renderTicks);
        });
        wireToggle("toggle-secondhand", showSecondHand, (v) => {
          showSecondHand = v;
          canvas.classList.toggle("no-second-hand", !v);
        });
        wireToggle("toggle-freeze", false, (v) => {
          if (v) {
            timeOverride = getNow(); // capture whatever's showing right now (mid-catchup or live)
            catchup = null; // and stop any in-progress catch-up -- we're locked now
          } else {
            const fromMs = (timeOverride || new Date()).getTime();
            timeOverride = null;
            catchup = {
              initialOffsetMs: fromMs - Date.now(), // how far behind live we are right now
              startPerf: performance.now(),
              duration: 650, // ms -- same "wind up, rush, overshoot, settle" regardless of how long it was frozen
            };
          }
        });

        wireToggle("toggle-allow-overlap", allowOverlap, (v) => {
          allowOverlap = v;
        });

        // ---- Grid size stepper (used to be "minimum grid cell size" when size was
        // derived from the viewport; now there's no derivation, so the stepper's
        // value directly IS the grid size) ----
        const GRID_SIZE_STEP = 4;
        const cellSizeValueEl = document.getElementById("cellSizeValue");
        function setGridSize(v) {
          GRID_SIZE = Math.max(8, v); // 8px floor so the stepper can't be driven to something nonsensical
          cellSizeValueEl.textContent = String(GRID_SIZE);
          computeGrid();
          rescaleClocksToGrid();
        }
        document
          .getElementById("cellSizeUp")
          .addEventListener("click", () => setGridSize(GRID_SIZE + GRID_SIZE_STEP));
        document
          .getElementById("cellSizeDown")
          .addEventListener("click", () => setGridSize(GRID_SIZE - GRID_SIZE_STEP));

        // ---- Grid Origin segmented control ----
        const gridOriginControl = document.getElementById("gridOriginControl");
        const gridOriginIndicator = gridOriginControl.querySelector(".switch-indicator");
        const gridOriginButtons = document.querySelectorAll(
          "#gridOriginControl .segmented-btn",
        );
        function positionGridOriginIndicator(btn) {
          gridOriginIndicator.style.width = btn.offsetWidth + "px";
          gridOriginIndicator.style.transform = `translateX(${btn.offsetLeft}px)`;
        }
        gridOriginButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            gridOrigin = btn.dataset.value;
            gridOriginButtons.forEach((b) =>
              b.classList.toggle("is-selected", b === btn),
            );
            positionGridOriginIndicator(btn);
            computeGrid();
            rescaleClocksToGrid();
          });
        });
        // Wait for fonts to load (rsms Inter changes button widths) AND a
        // paint, so offsetWidth/offsetLeft are final before measuring.
        const positionSelectedGridOrigin = () =>
          positionGridOriginIndicator(
            document.querySelector("#gridOriginControl .segmented-btn.is-selected"),
          );
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => requestAnimationFrame(positionSelectedGridOrigin));
        }
        requestAnimationFrame(positionSelectedGridOrigin);

        // ---- Clocks list (mirrors the `clocks` array; delete here == delete on canvas) ----
        // Row anatomy per the DarkClock frame (grip / index / tz field), plus
        // user-restored hover-revealed eye/trash actions. The timezone picker
        // reuses wireTzDropdown -- the exact custom dropdown from the canvas
        // context menu -- instead of a native <select>.
        const clocksListEl = document.getElementById("clocksList");
        function renderClocksList() {
          clocksListEl.innerHTML = "";
          clocks.forEach((c, i) => {
            const row = document.createElement("div");
            row.className = "clock-row";
            row.innerHTML = `
              <button type="button" class="clock-row-drag" title="Drag to reorder" aria-label="Drag to reorder clock ${i + 1}">
                <i class="ph-thin ph-dots-six-vertical"></i>
              </button>
              <span class="clock-row-index">${i + 1}</span>
              <div class="tz-input">
                <button type="button" class="tz-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="tz-value"></span>
                </button>
                <button type="button" class="tz-caret" title="Open timezone picker">
                  <i class="ph-light ph-caret-down"></i>
                </button>
                <ul class="tz-options" role="listbox" hidden></ul>
              </div>
              <div class="clock-row-actions">
                <button type="button" class="icon-btn" title="Toggle visibility">
                  <i class="ph-thin ph-eye"></i>
                </button>
                <button type="button" class="icon-btn danger" title="Delete clock">
                  <i class="ph-thin ph-trash"></i>
                </button>
              </div>
            `;
            wireTzDropdown(row.querySelector(".tz-input"), c);
            // Sidebar-row picks route through setClockTimezone without the
            // list rebuild (see the _fromSidebarRow guard there): the row's
            // own .tz-value needs the same update the canvas menu gets, and
            // the flag marks this call's origin around it. Capture phase so
            // this runs BEFORE wireTzDropdown's own bubble-phase option
            // handler below -- that one then sees tz === oldTz (no-op) and
            // just closes the popover.
            const rowValueEl = row.querySelector(".tz-input .tz-value");
            rowValueEl.textContent = tzDisplayLabel(c.timezone || LOCAL_TIMEZONE, new Date());
            row.querySelector(".tz-input").addEventListener(
              "click",
              (e) => {
                const li = e.target.closest("li[data-value]");
                if (!li || li.dataset.value === c.timezone) return;
                e.stopPropagation(); // keep wireTzDropdown's handler out of this pick entirely
                c._fromSidebarRow = true;
                try {
                  setClockTimezone(c, li.dataset.value);
                } finally {
                  c._fromSidebarRow = false;
                }
                rowValueEl.textContent = tzDisplayLabel(c.timezone, new Date());
                // Close the popover directly (mirrors wireTzDropdown.close
                // without reaching into its closure).
                const popover = row.querySelector(".tz-options");
                popover.hidden = true;
                popover.classList.remove("opens-up");
                row.querySelector(".tz-trigger").setAttribute("aria-expanded", "false");
                row.querySelector(".tz-input").classList.remove("is-open");
                document.getElementById("clocksList")?.classList.remove("dropdown-open");
              },
              true,
            );
            const eyeBtn = row.querySelector(".icon-btn:not(.danger)");
            let visible = c.el.style.display !== "none";
            eyeBtn.style.opacity = visible ? "1" : "0.4";
            eyeBtn.addEventListener("click", () => {
              visible = !visible;
              c.el.style.display = visible ? "" : "none";
              eyeBtn.style.opacity = visible ? "1" : "0.4";
            });
            row
              .querySelector(".icon-btn.danger")
              .addEventListener("click", () => removeClock(c));
            // ---- Drag-to-reorder: pointer-driven, rows slide live (FLIP).
            // Native HTML5 drag gives no per-frame cursor position and can't
            // move the row itself, so this uses pointer events: the dragged
            // row follows the cursor (fixed clone), siblings animate to their
            // new slots live, and drop commits the array order.
            const grip = row.querySelector(".clock-row-drag");
            grip.addEventListener("pointerdown", (e) => {
              e.preventDefault();
              const rows = [...clocksListEl.querySelectorAll(".clock-row")];
              const rowH = row.offsetHeight + 8; // 8px = #clocksList gap
              const listRect = clocksListEl.getBoundingClientRect();
              const grabOffsetY = e.clientY - row.getBoundingClientRect().top;
              row.classList.add("is-dragging");
              // Animate subsequent renders, not the grab itself.
              clocksListEl.classList.add("is-sorting");

              function move(ev) {
                const maxY = rows.length * rowH - 8 - row.offsetHeight; // minus one trailing gap the last row doesn't have
                const y = Math.max(
                  0,
                  Math.min(
                    maxY,
                    ev.clientY - listRect.top + clocksListEl.scrollTop - grabOffsetY,
                  ),
                );
                row.style.transform = `translateY(${y - i * rowH}px)`;
                // Nearest slot under the cursor; clamp to the list.
                const slot = Math.max(
                  0,
                  Math.min(
                    rows.length - 1,
                    Math.round(
                      (ev.clientY - listRect.top + clocksListEl.scrollTop - rowH / 2) / rowH,
                    ),
                  ),
                );
                rows.forEach((r, k) => {
                  if (r === row) return;
                  // Sibling's slot index after removing the dragged row:
                  // rows after it shift up one, then the dragged row's
                  // target slot pushes everyone at/after it down one.
                  let slotK = k > i ? k - 1 : k;
                  if (slotK >= slot) slotK += 1;
                  const dy = (slotK - k) * rowH;
                  r.style.transform = dy ? `translateY(${dy}px)` : "";
                  // Live index numerals: each sibling shows the number it
                  // would hold if dropped right now.
                  const num = r.querySelector(".clock-row-index");
                  if (num) num.textContent = slotK + 1;
                });
                const selfNum = row.querySelector(".clock-row-index");
                if (selfNum) selfNum.textContent = slot + 1;
                row.dataset.slot = slot;
              }
              function up() {
                window.removeEventListener("pointermove", move);
                window.removeEventListener("pointerup", up);
                const slot = parseInt(row.dataset.slot || i, 10);
                row.style.transform = "";
                rows.forEach((r) => (r.style.transform = ""));
                row.classList.remove("is-dragging");
                clocksListEl.classList.remove("is-sorting");
                delete row.dataset.slot;
                if (slot !== i) {
                  const [moved] = clocks.splice(i, 1);
                  clocks.splice(slot, 0, moved);
                  applyStackOrder();
                  refreshAllStackButtons();
                }
                renderClocksList();
              }
              window.addEventListener("pointermove", move);
              window.addEventListener("pointerup", up);
            });
            clocksListEl.appendChild(row);
          });
        }
        renderClocksList();

        // ---- Default clock: one centered clock so the canvas never starts empty ----
        // Default 16x7 cells; mobile fits the viewport, with grid-snapped edges.
        {
          const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
          const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          const mobile = window.matchMedia("(max-width: 640px)").matches;
          const margin = parseFloat(getComputedStyle(document.documentElement)
            .getPropertyValue(mobile ? "--mobile-margin" : "--page-margin"));
          const leftGrid = phaseX + Math.ceil((margin - phaseX) / GRID_SIZE) * GRID_SIZE;
          const rightGrid = phaseX + Math.floor((vw - margin - phaseX) / GRID_SIZE) * GRID_SIZE;
          const cellsW = mobile
            ? Math.max(MIN_SIZE_FACTOR, Math.min(16, Math.round((rightGrid - leftGrid) / GRID_SIZE)))
            : 16;
          const cellsH = mobile ? Math.max(MIN_SIZE_FACTOR, Math.round(cellsW * 7 / 16)) : 7;
          const w = cellsW * GRID_SIZE;
          const h = cellsH * GRID_SIZE;
          const centerX = mobile ? vw / 2
            : (vw - document.getElementById("sidebar").offsetWidth) / 2;
          const x = snap(centerX - w / 2, phaseX);
          const clock = createClock(
            mobile ? Math.max(leftGrid, Math.min(rightGrid - w, x)) : x,
            snap(vh / 2 - h / 2, phaseY),
            w,
            h,
          );
          clocks.unshift(clock);
          applyStackOrder();
          refreshAllStackButtons();
          renderClocksList();
        }

        // ---- Collapse/expand (drag handle OR the header caret) ----
        const sidebarEl = document.getElementById("sidebar");
        // Measure the header for collapsed positioning on desktop and mobile.
        function measureCollapsedHeight() {
          const h = document.getElementById("sidebar-header").offsetHeight;
          if (h) sidebarEl.style.setProperty("--collapsed-height", h + "px");
        }
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => requestAnimationFrame(measureCollapsedHeight));
        }
        requestAnimationFrame(measureCollapsedHeight);
        window.addEventListener("resize", measureCollapsedHeight);
        // Set the measured height before applying the initial collapsed state.
        measureCollapsedHeight();
        // Mobile starts collapsed (bottom sheet); desktop starts expanded.
        if (window.matchMedia("(max-width: 640px)").matches) {
          sidebarEl.dataset.state = "collapsed";
        }
        function toggleSidebarState() {
          sidebarEl.dataset.state =
            sidebarEl.dataset.state === "collapsed"
              ? "expanded"
              : "collapsed";
        }
        document
          .getElementById("sidebar-handle")
          .addEventListener("click", toggleSidebarState);
        document
          .getElementById("collapseBtn")
          .addEventListener("click", toggleSidebarState);

        // Suppress emulated hover after touch, including on hybrid devices.
        for (const type of ["pointerdown", "pointermove"]) {
          document.addEventListener(type, e => {
            document.documentElement.toggleAttribute("data-touch", e.pointerType !== "mouse");
          }, { capture: true, passive: true });
        }
        document.addEventListener("click", e => {
          if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
          const button = e.target.closest("button");
          if (button) setTimeout(() => button.blur(), 0);
        }, true);

        // Drag the sheet from its surface; scrollable content keeps native scrolling.
        {
          const header = sidebarEl;
          const body = document.getElementById("sidebar-body");
          function updateSheetScroll() {
            for (const el of [body, ...body.querySelectorAll("#clocksList")]) {
              el.style.touchAction = el.scrollTop > 0 ? "pan-y" : "pan-down";
            }
          }
          sidebarEl.addEventListener("scroll", updateSheetScroll, true);
          updateSheetScroll();
          let drag = null, suppressClick = false;
          header.addEventListener("click", e => {
            if (!suppressClick || e.detail === 0) return;
            suppressClick = false;
            e.preventDefault();
            e.stopImmediatePropagation();
          }, true);
          header.addEventListener("pointerdown", e => {
            if (!e.isPrimary || e.button !== 0 || e.target.closest("button, a, input, select, textarea, [role='listbox']") || drag) return;
            for (let el = e.target; el && el !== sidebarEl; el = el.parentElement) {
              if (el.scrollTop > 0) return;
            }
            e.preventDefault();
            suppressClick = false;
            const state = sidebarEl.dataset.state;
            const top = sidebarEl.getBoundingClientRect().top;
            sidebarEl.style.transition = "none";
            sidebarEl.dataset.state = "expanded";
            const expanded = sidebarEl.getBoundingClientRect().top;
            sidebarEl.dataset.state = "collapsed";
            const collapsed = sidebarEl.getBoundingClientRect().top;
            sidebarEl.dataset.state = state;
            sidebarEl.getBoundingClientRect();
            sidebarEl.style.removeProperty("transition");
            drag = { id: e.pointerId, y: e.clientY, state, top, expanded, collapsed, moved: false, dy: 0 };
            header.setPointerCapture(e.pointerId);
          });
          header.addEventListener("pointermove", e => {
            if (!drag || e.pointerId !== drag.id) return;
            drag.dy = e.clientY - drag.y;
            if (!drag.moved && Math.abs(drag.dy) < 6) return;
            drag.moved = true;
            sidebarEl.style.transition = "none";
            sidebarEl.dataset.state = "expanded";
            const top = Math.max(drag.expanded, Math.min(drag.collapsed, drag.top + drag.dy));
            sidebarEl.style.transform = `translateY(${top - drag.expanded}px)`;
          });
          function endDrag(e) {
            if (!drag || e.pointerId !== drag.id) return;
            const current = drag;
            drag = null;
            suppressClick = current.moved;
            sidebarEl.getBoundingClientRect();
            sidebarEl.style.removeProperty("transition");
            sidebarEl.style.removeProperty("transform");
            sidebarEl.dataset.state = e.type === "pointerup" && Math.abs(current.dy) >= 24
              ? (current.dy < 0 ? "expanded" : "collapsed") : current.state;
            if (header.hasPointerCapture(e.pointerId)) header.releasePointerCapture(e.pointerId);
          }
          header.addEventListener("pointerup", endDrag);
          header.addEventListener("pointercancel", endDrag);
          header.addEventListener("lostpointercapture", endDrag);
        }
      })();
    </script>
  </body>
</html>
